name: Alpine

on: push

jobs:
  alpine:
    runs-on: ubuntu-24.04
    container: 'alpine:3.23'

    steps:
      - name: Install and prepare Git
        run: |
          apk update && apk upgrade
          apk add git
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # Checks-out the repository under $GITHUB_WORKSPACE.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: 'recursive'
          persist-credentials: false
      - name: Install packages
        run: |
          apk update
          apk add catch2 cmake curl-dev g++ libarchive-dev libzip-dev make pkgconf unshield-dev
      - name: Build
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir build
          cd build
          cmake ../
          cmake --build . -j4
      - name: Start local httpbin instance for tests
        run: |
          apk add py3-gunicorn py3-httpbin grep
          gunicorn --bind=127.0.0.1:8080 httpbin:app --daemon
          while ! netstat -tna | grep LISTEN | grep --silent 8080
          do
              echo Waiting for httpbin server to start ...
              sleep 5
          done
      - name: Run tests
        run: |
          cd "$GITHUB_WORKSPACE/build"
          export USE_LOCAL_HTTPBIN=yes
          ctest -V
      - name: Build with statically linked standard libraries
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir build_static_std_libs
          cd build_static_std_libs
          cmake ../ -DENABLE_LTO=ON -DENABLE_STATIC_STANDARD_LIBRARIES=ON
          make -j4
